# Checks every pull request (and main): types, tests (agent answers + facts, Tanglish, Word export), build.
# Name "CI" and job "build" kept from the earlier workflow so any required-check settings still match.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
