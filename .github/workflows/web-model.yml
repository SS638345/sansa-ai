name: Build web model

# Converts a Whisper fine-tune to browser (transformers.js) ONNX files and uploads it as a free
# model repo on the HF_TOKEN owner's Hugging Face account, then tests it on a known Tamil clip.
on:
  workflow_dispatch:
    inputs:
      source:
        default: vasista22/whisper-tamil-medium
      base:
        default: openai/whisper-medium
      name:
        default: whisper-tamil-medium-web
      browser_test_only:
        description: Skip the export; only run the app in Chromium with the uploaded model
        type: boolean
        default: false
      model_artifact:
        description: Only upload the browser model files as a workflow artifact (for offline tests)
        type: boolean
        default: false
      long_only:
        description: Stop after the long-clip test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  artifact:
    if: ${{ inputs.model_artifact }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q huggingface_hub
          python3 -c "from huggingface_hub import snapshot_download as s; s('santhosh63/${{ inputs.name }}', local_dir='/tmp/m', allow_patterns=['*.json','onnx/encoder_model_quantized.onnx','onnx/decoder_model_merged_quantized.onnx'])"
          du -sh /tmp/m
      - uses: actions/upload-artifact@v4
        with:
          name: tamil-web-model
          path: /tmp/m
          retention-days: 2
  browser:
    if: inputs.browser_test_only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
      - name: Make sure the model is public (browsers have no token)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = f"{api.whoami()['name']}/${{ inputs.name }}"
          info = api.model_info(repo)
          print("before: private", info.private, "gated", info.gated)
          if info.private:
              api.update_repo_visibility(repo, private=False)
          if info.gated:
              api.update_repo_settings(repo, gated=False)
          info = api.model_info(repo)
          print("after: private", info.private, "gated", info.gated)
          PY
          curl -s -o /dev/null -w "anonymous config.json: %{http_code}\n" -L "https://huggingface.co/$(python3 -c "import os; from huggingface_hub import HfApi; print(HfApi(token=os.environ['HF_TOKEN']).whoami()['name'])")/${{ inputs.name }}/resolve/main/config.json"
      - name: Compare how Hugging Face answers browsers
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) HeadlessChrome/131.0.0.0 Safari/537.36"
          for repo in santhosh63/${{ inputs.name }} onnx-community/whisper-base; do
            u="https://huggingface.co/$repo/resolve/main/config.json"
            echo "$repo plain: $(curl -s -o /dev/null -w '%{http_code}' -L "$u")"
            echo "$repo origin: $(curl -s -o /dev/null -w '%{http_code}' -L -H 'Origin: http://localhost:4173' "$u")"
            echo "$repo headless UA: $(curl -s -o /dev/null -w '%{http_code}' -L -A "$UA" "$u")"
            curl -s -D - -o /tmp/body -A "$UA" -H 'Origin: http://localhost:4173' "$u" | head -20; head -c 300 /tmp/body; echo
          done
      - name: Install Chromium and test audio
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q gTTS
          python3 -c "from gtts import gTTS; gTTS('இன்று காலை நான் சந்தைக்கு சென்று காய்கறிகள் வாங்கினேன். மழை பெய்ததால் கொஞ்சம் தாமதமாக வீட்டுக்கு வந்தேன்.', lang='ta').save('/tmp/known.mp3')"
      - name: Mirror the model files the app will load
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi, snapshot_download
          user = HfApi(token=os.environ["HF_TOKEN"]).whoami()["name"]
          for repo, onnx in [(f"{user}/${{ inputs.name }}", ["onnx/encoder_model_quantized.onnx", "onnx/decoder_model_merged_quantized.onnx"]),
                             ("onnx-community/whisper-base", ["onnx/encoder_model.onnx", "onnx/encoder_model_quantized.onnx", "onnx/decoder_model_merged_quantized.onnx"])]:
              snapshot_download(repo, local_dir=f"/tmp/mirror/{repo}", allow_patterns=["*.json"] + onnx)
          PY
          du -sh /tmp/mirror/*/*
      - name: Upload a Tamil clip in the real app
        env:
          MIRROR: /tmp/mirror
          LONG_ONLY: ${{ inputs.long_only && '1' || '' }}
        run: |
          (npx vite preview --port 4173 &) && sleep 5
          E="இன்று காலை நான் சந்தைக்கு சென்று காய்கறிகள் வாங்கினேன் மழை பெய்ததால் கொஞ்சம் தாமதமாக வீட்டுக்கு வந்தேன்"
          echo "--- control: the general base model ---"
          node webmodel/browser-test.cjs /tmp/known.mp3 "$E" onnx-community/whisper-base 2>&1 | tail -20 || true
          echo "--- default Tamil model ---"
          node webmodel/browser-test.cjs /tmp/known.mp3 "$E"
          echo "--- long clip (2 min, Tamil model) ---"
          python3 webmodel/make-long-clip.py /tmp/long.mp3
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/long.mp3
          node webmodel/browser-test.cjs /tmp/long.mp3 "$(cat /tmp/long.mp3.txt)"
          echo "--- same clip, phone quality + background noise ---"
          ffmpeg -loglevel error -y -i /tmp/long.mp3 -f lavfi -i "anoisesrc=color=pink:amplitude=0.06:seed=7" \
            -filter_complex "[0:a]highpass=f=300,lowpass=f=3400[s];[s][1:a]amix=inputs=2:duration=first:normalize=0,aresample=8000" -ac 1 /tmp/noisy.wav
          echo "noise clean-up OFF:"; node webmodel/browser-test.cjs /tmp/noisy.wav "$(cat /tmp/long.mp3.txt)" | grep -E "words matched|error box"
          echo "noise clean-up ON:"; DENOISE=1 node webmodel/browser-test.cjs /tmp/noisy.wav "$(cat /tmp/long.mp3.txt)" | grep -E "words matched|error box"
          [ -n "$LONG_ONLY" ] && exit 0
          echo "--- other file formats (browser decoder or ffmpeg.wasm fallback) ---"
          sudo apt-get install -y -qq ffmpeg >/dev/null
          # Ubuntu's ffmpeg has no AMR encoder; the static build does (Android call recordings are AMR).
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C /tmp \
            && /tmp/ffmpeg-*-static/ffmpeg -loglevel error -i /tmp/known.mp3 -ar 8000 -ac 1 -c:a libopencore_amrnb -b:a 12.2k /tmp/known.amr || true
          ffmpeg -loglevel error -i /tmp/known.mp3 -ar 8000 -ac 1 -c:a aac /tmp/known.3gp
          ffmpeg -loglevel error -i /tmp/known.mp3 -c:a wmav2 /tmp/known.wma
          ffmpeg -loglevel error -i /tmp/known.mp3 -c:a aac /tmp/known.aac
          ffmpeg -loglevel error -i /tmp/known.mp3 -c:a libopus /tmp/known.opus
          ffmpeg -loglevel error -i /tmp/known.mp3 /tmp/known.flac
          ffmpeg -loglevel error -i /tmp/known.mp3 -c:a pcm_s16le /tmp/known.caf
          ls -la /tmp/known.*
          set -o pipefail; fail=0
          for f in /tmp/known.amr /tmp/known.3gp /tmp/known.wma /tmp/known.aac /tmp/known.opus /tmp/known.flac /tmp/known.caf; do
            [ -s "$f" ] || { echo "skip $f (could not make it)"; continue; }
            echo "=== $f"
            node webmodel/browser-test.cjs "$f" "$E" onnx-community/whisper-base 2>&1 | grep -E "model:|seconds:|GOT:|error|decoder" || fail=1
          done
          [ -s /tmp/known.amr ] && { echo "=== Tamil model on amr"; node webmodel/browser-test.cjs /tmp/known.amr "$E" 2>&1 | grep -E "seconds:|GOT:|error" ; }
          exit $fail

  build:
    if: ${{ !inputs.browser_test_only && !inputs.model_artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Get transformers.js conversion scripts
        run: git clone --depth 1 --branch 3.0.2 https://github.com/huggingface/transformers.js /tmp/tjs
      - name: Install
        run: |
          # NVIDIA's index is unreachable from runners; graphsurgeon is on PyPI too.
          sed -i '/ngc.nvidia/d; s/onnx_graphsurgeon==0.3.27/onnx_graphsurgeon==0.5.2/' /tmp/tjs/scripts/requirements.txt
          # Newer transformers export a decoder transformers.js cannot run (cache_position input in
          # >= 4.43, a broken positions Slice in 4.42). 4.38 matches the official web Whisper exports.
          sed -i 's/^transformers\[torch\]==.*/transformers[torch]==4.38.2/' /tmp/tjs/scripts/requirements.txt
          cat /tmp/tjs/scripts/requirements.txt
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu \
            -r /tmp/tjs/scripts/requirements.txt huggingface_hub gTTS "numpy<2"
          python3 -c "import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__)"
      - name: Export and upload
        working-directory: /tmp/tjs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 "$GITHUB_WORKSPACE/webmodel/export.py" "${{ inputs.source }}" "${{ inputs.base }}" "${{ inputs.name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Test in transformers.js
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          npm ci
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -c "from gtts import gTTS; gTTS('இன்று காலை நான் சந்தைக்கு சென்று காய்கறிகள் வாங்கினேன். மழை பெய்ததால் கொஞ்சம் தாமதமாக வீட்டுக்கு வந்தேன்.', lang='ta').save('/tmp/known.mp3')"
          ffmpeg -v quiet -i /tmp/known.mp3 -ac 1 -ar 16000 -f f32le /tmp/known.f32
          USER=$(python3 -c "import os; from huggingface_hub import HfApi; print(HfApi(token=os.environ['HF_TOKEN']).whoami()['name'])")
          REPO="$USER/${{ inputs.name }}"
          echo "Model: https://huggingface.co/$REPO"
          node webmodel/test.mjs "$REPO" /tmp/known.f32 fp32 q8
          node webmodel/test.mjs "$REPO" /tmp/known.f32 q8 q8
          node webmodel/test.mjs "$REPO" /tmp/known.f32 fp16 q4 || true
