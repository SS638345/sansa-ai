name: Build web model

# Converts a Whisper fine-tune to browser (transformers.js) ONNX files and uploads it as a free
# model repo on the HF_TOKEN owner's Hugging Face account, then tests it on a known Tamil clip.
on:
  workflow_dispatch:
    inputs:
      source:
        default: vasista22/whisper-tamil-medium
      base:
        default: openai/whisper-medium
      name:
        default: whisper-tamil-medium-web

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Get transformers.js conversion scripts
        run: git clone --depth 1 --branch 3.0.2 https://github.com/huggingface/transformers.js /tmp/tjs
      - name: Install
        run: |
          # NVIDIA's index is unreachable from runners; graphsurgeon is on PyPI too.
          sed -i '/ngc.nvidia/d; s/onnx_graphsurgeon==0.3.27/onnx_graphsurgeon==0.5.2/' /tmp/tjs/scripts/requirements.txt
          cat /tmp/tjs/scripts/requirements.txt
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu \
            -r /tmp/tjs/scripts/requirements.txt huggingface_hub gTTS "numpy<2"
          python3 -c "import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__)"
      - name: Export and upload
        working-directory: /tmp/tjs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 "$GITHUB_WORKSPACE/webmodel/export.py" "${{ inputs.source }}" "${{ inputs.base }}" "${{ inputs.name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Test in transformers.js
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          npm ci
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -c "from gtts import gTTS; gTTS('இன்று காலை நான் சந்தைக்கு சென்று காய்கறிகள் வாங்கினேன். மழை பெய்ததால் கொஞ்சம் தாமதமாக வீட்டுக்கு வந்தேன்.', lang='ta').save('/tmp/known.mp3')"
          ffmpeg -v quiet -i /tmp/known.mp3 -ac 1 -ar 16000 -f f32le /tmp/known.f32
          USER=$(python3 -c "import os; from huggingface_hub import HfApi; print(HfApi(token=os.environ['HF_TOKEN']).whoami()['name'])")
          REPO="$USER/${{ inputs.name }}"
          echo "Model: https://huggingface.co/$REPO"
          node webmodel/test.mjs "$REPO" /tmp/known.f32 fp32 q8
          node webmodel/test.mjs "$REPO" /tmp/known.f32 q8 q8
          node webmodel/test.mjs "$REPO" /tmp/known.f32 fp16 q4 || true
